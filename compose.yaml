# Local development only. Production Redis requires private networking, ACL and TLS.
services:
  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:${LATER_REDIS_PORT:-6379}:6379'
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
